name: Sync to Hugging Face Hub
on:
  push:
    branches: [main]
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Push to Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # NOTE: If your Hugging Face Space name is different,
          # please update "rag-chatbot" in the URL below:
          git push --force https://AlenJa002:$HF_TOKEN@huggingface.co/spaces/AlenJa002/rag-chatbot.git main
