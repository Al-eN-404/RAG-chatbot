name: Sync to Hugging Face Hub
on:
  push:
    branches: [main]
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Push to Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # NOTE: If your Hugging Face Space name is different,
          # please update "rag-chatbot" in the URL below:
          git push --force https://AlenJa002:$HF_TOKEN@huggingface.co/spaces/AlenJa002/rag-chatbot.git main
name: Sync to Hugging Face spaces
on:
  push:
    branches: [main] # Change to 'master' if your default branch is master

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force https://AlenJa002:$HF_TOKEN@huggingface.co/spaces/AlenJa002/rag-chatbot main
